<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>梦神破甲 · autokill-purge</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0b0b0c; color: #c9c9cf; font: 14px/1.6 "Segoe UI", system-ui, sans-serif; }
    .wrap { height: 100%; display: grid; place-items: center; text-align: center; gap: 10px; }
    .logo { width: 88px; height: 88px; border-radius: 20px; }
    .t { font-size: 18px; font-weight: 600; color: #f2f2f5; letter-spacing: .02em; }
    .s { opacity: .6; }
    .bar { width: 220px; height: 3px; margin-top: 14px; border-radius: 2px; background: #1c1c20; overflow: hidden; }
    .bar i { display: block; height: 100%; width: 40%; background: linear-gradient(90deg, #ff8a3d, #ffd166); animation: slide 1.1s ease-in-out infinite; }
    @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
  </style>
</head>
<body>
  <div class="wrap">
    <img class="logo" src="logo.png" alt="logo" onerror="this.style.display='none'" />
    <div class="t">梦神破甲 · autokill-purge</div>
    <div class="s">正在拉起本地控制台（127.0.0.1）…</div>
    <div class="bar"><i></i></div>
  </div>
</body>
</html>
