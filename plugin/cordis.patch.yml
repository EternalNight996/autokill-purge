# 梦神破甲 · autokill-purge 装备插件 bundle patch（v0.3.0）
#
# 只做三件事：
#   ① 发布演练台事实库服务（ctx.redteam）
#   ② 落地预设/技能（~/.dsh/.agent-presets/redteam、~/.dsh/redteam/skills）
#   ③ 控制台工具桥（autokill_*，HTTP 转 127.0.0.1:8792）
#
# 58 个 redteam_* 工具**不在这里全局挂载**：只挂在「梦神破甲」预设里，
# 避免每个会话都白付约 1.1 万 tokens 的工具 schema。
# 内核已内化在 vendor/，不依赖 dsh-purge 包。

- insert:
    # ---- 演练台事实库（进程级唯一，SQLite 在 $DSH_HOME/redteam）----
    - id: autokill-redteam-store
      name: 'autokill-purge-plugin/redteam/store'
      config:
        root: !!js dshHomePath('redteam')

    # ---- 预设/技能自举（宿主平面；不改系统提示词）----
    - id: autokill-redteam
      name: 'autokill-purge-plugin/redteam'

    # ---- autokill-purge 自己的工具桥（autokill_*）----
    - id: autokill-purge
      name: 'autokill-purge-plugin'
      inject: [systemPrompt, tools]
      config:
        toolsEnable: true
        assembleEnable: true
        sessionEnable: false
        consoleUrl: 'http://127.0.0.1:8792'
        allowWriteTools: false
        verbose: false
